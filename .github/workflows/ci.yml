name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          go build -o /dev/null ./cmd/server
          go build -o /dev/null ./cmd/coordinator
          go build -o /dev/null ./cmd/migrate
          go build -o /dev/null ./cmd/rebuild-index
          go build -o /dev/null ./cmd/recovery-tool
          go build -o /dev/null ./cmd/shard-sync
